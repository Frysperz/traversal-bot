name: NNUE Alpha-Beta Bot Build and Duel

on: [push, workflow_dispatch]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install numpy

      - name: Generate Quantized NNUE Weights
        run: python scripts/gen_nnue.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM Bot
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Checkout Traversal Arena SDK
        uses: actions/checkout@v4
        with:
          repository: Sylv-Lej/traversal-rust-sdk
          path: arena-sdk

      - name: Build Arena Docker Image
        run: |
          cd arena-sdk
          docker build -f arena/Dockerfile -t traversal-arena .

      - name: Duel Against Sommet
        run: |
          docker run --rm -v "$PWD":/w traversal-arena duel /w/target/wasm32-unknown-unknown/release/mon_bot.wasm sommet --games 20

      - name: Upload Bot
        uses: actions/upload-artifact@v4
        with:
          name: mon_bot_nnue_wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
