name: Build and Test WASM Bot

on: [push, workflow_dispatch]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bot repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Checkout Traversal Arena SDK
        uses: actions/checkout@v4
        with:
          repository: Sylv-Lej/traversal-rust-sdk
          path: arena-sdk

      - name: Build Arena Docker Image
        run: |
          cd arena-sdk
          docker build -f arena/Dockerfile -t traversal-arena .

      - name: Run Duel against Reference Bot (Sommet)
        run: |
          docker run --rm -v "$PWD":/w traversal-arena duel /w/target/wasm32-unknown-unknown/release/mon_bot.wasm sommet --games 20

      - name: Upload Bot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mon_bot_wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
