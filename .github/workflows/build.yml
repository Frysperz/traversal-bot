name: Self-Play Train, Build and Test

on: [push, workflow_dispatch]

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Self-Play Training Session
        run: python scripts/train.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM Bot
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Checkout Traversal Arena SDK
        uses: actions/checkout@v4
        with:
          repository: Sylv-Lej/traversal-rust-sdk
          path: arena-sdk

      - name: Build Arena Docker Image
        run: |
          cd arena-sdk
          docker build -f arena/Dockerfile -t traversal-arena .

      - name: Duel Against Reference Bot (Sommet)
        run: |
          docker run --rm -v "$PWD":/w traversal-arena duel /w/target/wasm32-unknown-unknown/release/mon_bot.wasm sommet --games 20

      - name: Upload Trained Bot WASM
        uses: actions/upload-artifact@v4
        with:
          name: mon_bot_entraine_wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
